<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3b4d">
  <title>Aage Ke? (আগে কে?)</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <style>
    :root {
      --ink: #1d2327; --muted: #5d6970; --bg: #f4f6f7; --card: #fff; --line: #dde3e6;
      --brand: #1f3b4d; --red: #b3261e; --red-bg: #fdecea; --amber: #a15c00; --amber-bg: #fff4e0;
      --green: #2e6b34; --green-bg: #e8f3e9;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Noto Sans Bengali", "Hind Siliguri", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 17px; line-height: 1.45; }
    main { padding: 12px 16px 40px; max-width: 640px; margin: 0 auto; }
    h1 { font-size: 1.1rem; margin: 0; flex: 1; }
    h2 { font-size: 1rem; margin: 18px 0 8px; }
    button, .btn { font: inherit; border: 0; border-radius: 10px; padding: 12px 14px; background: var(--brand); color: #fff;
      cursor: pointer; text-decoration: none; display: inline-block; text-align: center; min-height: 48px; }
    button:disabled, .btn[disabled] { opacity: .5; }
    button.ghost { background: transparent; color: inherit; border: 1px solid var(--line); }
    button.small, .small { font-size: .85rem; }
    button.red, .btn.red { background: var(--red); }
    button.amber { background: var(--amber); }
    button.green { background: var(--green); }
    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: var(--brand); color: #fff;
      position: sticky; top: 0; z-index: 2; }
    .bar button.ghost { color: #fff; border-color: rgba(255,255,255,.4); min-height: 40px; padding: 6px 10px; }
    .banner { background: #fff8d6; color: #5a4a00; padding: 8px 16px; font-size: .9rem; text-align: center; }
    .muted { color: var(--muted); } .center { text-align: center; }
    .err { color: var(--red); font-weight: 600; }
    .pin { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 32px 16px; max-width: 360px; margin: 0 auto; }
    .brand { font-size: 2rem; font-weight: 700; color: var(--brand); }
    .dots { display: flex; gap: 14px; }
    .dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--brand); }
    .dots span.on { background: var(--brand); }
    .keys { display: grid; grid-template-columns: repeat(3, 72px); gap: 12px; }
    .keys button { font-size: 1.4rem; background: var(--card); color: var(--ink); border: 1px solid var(--line); min-height: 64px; }
    .judge { width: 100%; background: var(--amber); font-weight: 600; }
    .tier h2 { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; }
    .tier.red h2 { background: var(--red-bg); color: var(--red); }
    .tier.amber h2 { background: var(--amber-bg); color: var(--amber); }
    .tier.green h2 { background: var(--green-bg); color: var(--green); }
    .count { margin-left: auto; font-size: .85rem; }
    .row { display: grid; width: 100%; text-align: left; background: var(--card); color: var(--ink);
      border: 1px solid var(--line); margin: 6px 0; padding: 10px 12px; gap: 2px; }
    .tier.red .row { border-left: 6px solid var(--red); }
    .tier.amber .row { border-left: 6px solid var(--amber); }
    .tier.green .row { border-left: 6px solid var(--green); }
    .row .code { font-weight: 700; } .row .meta, .row .why { font-size: .9rem; color: var(--muted); }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
    .card.tier-red { border-left: 6px solid var(--red); } .card.tier-amber { border-left: 6px solid var(--amber); }
    .card.tier-green { border-left: 6px solid var(--green); }
    .big { font-size: 1.25rem; font-weight: 700; }
    .why { font-weight: 600; }
    .msgs { list-style: none; padding: 0; margin: 0; }
    .msg { width: 100%; text-align: left; background: var(--card); color: var(--ink); border: 1px solid var(--line);
      display: grid; gap: 4px; margin: 6px 0; }
    .time { font-size: .8rem; color: var(--muted); }
    .gloss { display: block; font-size: .85rem; color: var(--muted); font-style: italic; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .85rem; background: #eef1f2; margin: 2px 0; }
    .pill.big { font-size: 1rem; padding: 8px 14px; }
    .pill.amber { background: var(--amber-bg); color: var(--amber); }
    .pill.green { background: var(--green-bg); color: var(--green); }
    .pill.confirmed { background: var(--red-bg); color: var(--red); font-weight: 600; }
    .pill.rejected { text-decoration: line-through; color: var(--muted); }
    .pill.unsure { border: 1px dashed var(--amber); }
    .chip { display: grid; grid-template-columns: 1fr 56px 56px; gap: 8px; align-items: center; background: var(--card);
      border: 2px solid var(--line); border-radius: 12px; padding: 8px; margin: 8px 0; }
    .chip.sure { border-color: var(--brand); } .chip.unsure { border-style: dashed; border-color: var(--amber); }
    .chip.confirmed { background: var(--red-bg); } .chip.rejected { opacity: .55; }
    .chip-label { display: grid; } .chip-label small { color: var(--muted); }
    .chip .state { font-weight: 700; color: var(--ink); }
    .chip .yes { background: var(--green); } .chip .no { background: var(--muted); }
    .form { display: grid; gap: 12px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    input, select, textarea { font: inherit; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; width: 100%; }
    blockquote { margin: 8px 0; background: var(--card); border-left: 4px solid var(--brand); padding: 10px 12px; border-radius: 6px; }
    .sms-body { white-space: pre-wrap; }
    .links a { color: var(--brand); }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
      padding: 10px 16px; border-radius: 8px; z-index: 9; }
  </style>
</head>
<body>
  <div id="app"><p class="center muted">…</p></div>
  <script src="model.js"></script>
  <script src="rules.js"></script>
  <script src="i18n.js"></script>
  <script src="store.js"></script>
  <script src="app.js"></script>
</body>
</html>
